<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Details</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="details.js" defer></script>
</head>
<body class="assignments-page">
    <header class="navbar">
        <div class="container">
            <h1 id="assignment-title"></h1>
        </div>
    </header>

    <main class="container">
        <article class="card assignment-details">
            <p id="assignment-due-date"></p>

            <h2>Description</h2>
            <p id="assignment-description"></p>

            <h2>Attached Files & Links</h2>
            <ul id="assignment-files-list"></ul>
        </article>

        <section id="discussion-forum" class="card assignment-comments">
            <h2>Questions & Discussion</h2>

            <div id="comment-list" aria-live="polite"></div>

            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Ask a Question</legend>

                    <label for="comment-author">Name</label>
                    <input id="comment-author" type="text" required>

                    <label for="new-comment">Comment</label>
                    <textarea id="new-comment" required></textarea>

                    <button class="btn btn-primary" type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
