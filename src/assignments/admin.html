<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="admin.js" defer></script>
</head>
<body class="assignments-page assignments-admin">
    <header class="navbar">
        <div class="container container-wide">
            <h1>Manage Assignments</h1>
        </div>
    </header>

    <main class="container container-wide">
        <section class="card">
            <h2 id="form-heading">Add a New Assignment</h2>

            <form id="assignment-form" action="#">
                <fieldset>
                    <legend>Assignment Details</legend>

                    <label for="assignment-title">Title</label>
                    <input id="assignment-title" type="text" required>

                    <label for="assignment-description">Description</label>
                    <textarea id="assignment-description" rows="5" required></textarea>

                    <label for="assignment-due-date">Due Date</label>
                    <input id="assignment-due-date" type="date" required>

                    <label for="assignment-files">Attached File URLs</label>
                    <textarea id="assignment-files" rows="3" placeholder="Enter one URL per line"></textarea>

                    <button id="add-assignment" class="btn btn-primary" type="submit">Add Assignment</button>
                </fieldset>
            </form>
        </section>

        <section class="card">
            <h2>Current Assignments</h2>

            <div class="table-wrapper">
                <table id="assignments-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Due Date</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assignments-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
