<!--
  Requirement: Create the Admin View for the Weekly Breakdown

  Instructions:
  Fill in the HTML elements as described in the comments.
  This page allows the teacher (admin) to perform full CRUD operations
  on the weekly course content.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Weekly Breakdown</title>
    <link rel="stylesheet" href="../common/styles.css">
    <!-- Required: link admin.js with defer. -->
    <script src="admin.js" defer></script>
</head>
<body class="weekly-page weekly-admin" class="weekly-page weekly-admin">
    <header class="navbar">
        <div class="container container-wide">
            <h1>Manage Weekly Breakdown</h1>
        </div>
    </header>

    <main class="container container-wide">

        <!-- ============================================================
             Section 1: Add / Edit Week Form
             ============================================================ -->
        <section class="card">
            <h2 id="form-heading">Add a New Week</h2>

            <form id="week-form" action="#">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <label for="week-title">Week Title</label>
                    <input id="week-title" type="text" placeholder="Week 1: Introduction to HTML" required>

                    <label for="week-start-date">Start Date</label>
                    <input id="week-start-date" type="date" required>

                    <label for="week-description">Description</label>
                    <textarea id="week-description" rows="5" required></textarea>

                    <label for="week-links">Resource Links (one URL per line)</label>
                    <textarea id="week-links" rows="3" placeholder="Enter one URL per line"></textarea>

                    <button id="add-week" class="btn btn-primary" type="submit">Add Week</button>
                </fieldset>
            </form>
        </section>


        <!-- ============================================================
             Section 2: Existing Weekly Entries
             ============================================================ -->
        <section class="card">
            <h2>Current Weekly Breakdown</h2>

            <div class="table-wrapper">
                <table id="weeks-table">
                    <thead>
                        <tr>
                            <th>Week Title</th>
                            <th>Start Date</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="weeks-tbody"></tbody>
                </table>
            </div>

                <!-- admin.js will inject rows here. Each row follows
                     this structure (do NOT hardcode real data):

                <tr>
                    <td>Week 1: Introduction to HTML</td>
                    <td>2025-01-13</td>
                    <td>Learn HTML fundamentals...</td>
                    <td>
                        <button class="edit-btn"   data-id="1">Edit</button>
                        <button class="delete-btn" data-id="1">Delete</button>
                    </td>
                </tr>

                The data-id attribute holds the integer id from the
                weeks table (primary key). -->

            <!-- End of <table> -->
        <!-- End of list <section> -->

    <!-- End of <main> -->
</body>
</html>
