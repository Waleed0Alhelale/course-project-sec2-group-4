<!--
  Requirement: Create the Student View for the Weekly Breakdown

  Instructions:
  This page is a read-only view for students to see the plan for all weeks.
  Each week should link to its dedicated detail page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Course Breakdown</title>
    <link rel="stylesheet" href="../common/styles.css">
    <!-- Required: link list.js with defer so the DOM is ready before the
         script runs. -->
    <script src="list.js" defer></script>
</head>
<body class="weekly-page">
    <header class="navbar">
        <div class="container">
            <h1>Weekly Course Breakdown</h1>
        </div>
    </header>

    <main class="container">
        <section id="week-list-section" aria-live="polite">

            <p>Loading weeks...</p>
        </section>
    </main>
</body>
</html>
